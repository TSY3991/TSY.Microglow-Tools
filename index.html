<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="TSY.Microglow 工具箱，集中放置桌面小工具與網頁工具的下載與使用入口。"
    >
    <title>TSY.Microglow 工具箱</title>
    <link rel="icon" href="./assets/logo-mark.png" type="image/png">
    <link rel="stylesheet" href="./shared/base.css?v=20260713a">
  </head>
  <body>
    <main class="lobby-shell">
      <header class="lobby-hero" aria-labelledby="page-title">
        <a class="back-link" href="https://tsy3991.github.io/TSY.Microglow-Website/" data-portal-return>回入口網站</a>
        <div class="hero-copy">
          <p class="eyebrow">Microglow Tools</p>
          <h1 id="page-title">工具箱</h1>
          <p>
            這裡集中放置微光創作室做的實用小工具，包含可下載安裝的桌面程式與網頁工具。
            入口網站只負責導流，工具在這個專案中獨立維護、獨立發版。
          </p>
        </div>
      </header>

      <section class="tool-section" aria-labelledby="tools-title">
        <div class="section-heading">
          <h2 id="tools-title">可用工具</h2>
          <span>持續新增中</span>
        </div>

        <div class="tool-grid">
          <article class="tool-card">
            <div class="tool-thumb" aria-hidden="true">
              <span class="tool-thumb-icon icon-download"></span>
            </div>
            <div class="tool-card-copy">
              <p>Windows 桌面工具</p>
              <h3>隨身硬碟同步備份工具</h3>
              <span>把電腦資料夾自動備份到隨身硬碟，支援保守同步與鏡像同步，刪除的檔案會先隔離 30 天才清除。</span>
            </div>
            <a class="primary-link" href="./tools/portable-backup-tool/">前往下載</a>
          </article>

          <article class="tool-card is-coming">
            <div class="tool-thumb" aria-hidden="true">
              <span class="tool-thumb-icon icon-download"></span>
            </div>
            <div class="tool-card-copy">
              <p>準備中</p>
              <h3>下一款工具</h3>
              <span>陸續加入中，包含桌面工具與網頁／App 型工具。</span>
            </div>
            <span class="disabled-link">規劃中</span>
          </article>
        </div>
      </section>
    </main>
    <script src="./shared/portal-return.js?v=20260713a"></script>
  </body>
</html>
